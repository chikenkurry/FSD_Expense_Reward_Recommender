events { worker_connections 1024; }

http {
    upstream card_api_cluster {
        least_conn;
        server api-1:8080 max_fails=3 fail_timeout=10s;
        server api-2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        # Gzip compression for API responses
        gzip on;
        gzip_types application/json text/plain text/html text/css application/javascript;
        gzip_min_length 256;

        # Health probe directly from load balancer
        location /lb-health {
            return 200 '{"status":"healthy","balancer":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # Route all application traffic to backend API cluster
        location / {
            proxy_pass http://card_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP 1.1 keepalive support
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}

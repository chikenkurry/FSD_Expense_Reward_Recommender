[project]
name = "credit-card-rewards-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]

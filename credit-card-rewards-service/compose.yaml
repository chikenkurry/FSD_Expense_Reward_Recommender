services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CARD_DB_NAME:-catalogue}
      MYSQL_USER: ${CARD_DB_USER:-card_user}
      MYSQL_PASSWORD: ${CARD_DB_PASSWORD:-card_secure_pass_123}
      MYSQL_ROOT_PASSWORD: ${CARD_DB_ROOT_PASSWORD:-root_secure_pass_123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  api-1:
    build: .
    command: [serve, --config, config/sources_singapore_banks.json, --db, "mysql+pymysql://card_user:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/catalogue", --host, 0.0.0.0, --port, "8080"]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:?required}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:?required}
      DATABASE_URL: mysql+pymysql://${CARD_DB_USER:-card_user}:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/${CARD_DB_NAME:-catalogue}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - catalogue-data:/data
    restart: unless-stopped

  api-2:
    build: .
    command: [serve, --config, config/sources_singapore_banks.json, --db, "mysql+pymysql://card_user:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/catalogue", --host, 0.0.0.0, --port, "8080"]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:?required}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:?required}
      DATABASE_URL: mysql+pymysql://${CARD_DB_USER:-card_user}:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/${CARD_DB_NAME:-catalogue}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - catalogue-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: [worker, --once, --db, "mysql+pymysql://card_user:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/catalogue"]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:-admin-secret}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:-internal-secret}
      DATABASE_URL: mysql+pymysql://${CARD_DB_USER:-card_user}:${CARD_DB_PASSWORD:-card_secure_pass_123}@mysql:3306/${CARD_DB_NAME:-catalogue}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - catalogue-data:/data
    profiles:
      - manual-worker

volumes:
  mysql-data: {}
  catalogue-data: {}

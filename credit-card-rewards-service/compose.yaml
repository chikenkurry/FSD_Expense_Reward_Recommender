services:
  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  api-1:
    build: .
    command: [serve, --config, config/sources_singapore_banks.json, --db, /data/catalogue.sqlite, --host, 0.0.0.0, --port, "8080"]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:?required}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:?required}
    volumes:
      - catalogue-data:/data
    restart: unless-stopped

  api-2:
    build: .
    command: [serve, --config, config/sources_singapore_banks.json, --db, /data/catalogue.sqlite, --host, 0.0.0.0, --port, "8080"]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:?required}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:?required}
    volumes:
      - catalogue-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: [worker, --once, --db, /data/catalogue.sqlite]
    environment:
      CARD_ADMIN_BEARER: ${CARD_ADMIN_BEARER:-admin-secret}
      CARD_INTERNAL_BEARER: ${CARD_INTERNAL_BEARER:-internal-secret}
    volumes:
      - catalogue-data:/data
    profiles:
      - manual-worker

volumes:
  catalogue-data: {}
